<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Modern subtle glow filter to make it look active in tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek dark background for contrast in light/dark tab interfaces -->
  <rect width="100%" height="100%" rx="18" fill="#0C0E12" />

  <!-- Outer Hexagon (Benzene Ring Style) in subtle green -->
  <path 
    d="M50 8 L88 30 V70 L50 92 L12 70 V30 L50 8 Z" 
    fill="none" 
    stroke="#10B981" 
    stroke-opacity="0.15" 
    stroke-width="3"
  />
  
  <path 
    d="M50 14 L81 32 V68 L50 86 L19 32 Z" 
    fill="none" 
    stroke="#10b981" 
    stroke-opacity="0.1" 
    stroke-width="5"
  />

  <path 
    d="M50 15 L80 32.5 V67.5 L50 85 L20 67.5 V32.5 L50 15 Z" 
    fill="none" 
    stroke="#10B981" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  
  <!-- Inner "X" / Molecular Bond Structure representing advanced chemistry -->
  <path 
    d="M35 35 L65 65 M65 35 L35 65" 
    stroke="#FFFFFF" 
    stroke-width="9" 
    stroke-linecap="round"
  />
  
  <!-- Molecular nodes in accent emerald -->
  <circle cx="35" cy="35" r="5" fill="#10B981" />
  <circle cx="65" cy="65" r="5" fill="#10B981" />
  <circle cx="65" cy="35" r="5" fill="#10B981" />
  <circle cx="35" cy="65" r="5" fill="#10B981" />
  <circle cx="50" cy="15" r="4.5" fill="#FFFFFF" />
  <circle cx="50" cy="85" r="4.5" fill="#FFFFFF" />
</svg>
